# Dedicated Simutrans-Horizon server with the browser dashboard (see README.md).
# Variables come from .env next to this file: SIMUTRANS_LAN_IP, SIMUTRANS_INITIAL_SAVE,
# SIMUTRANS_DASHBOARD_HOSTS, SIMUTRANS_DASHBOARD_TOKEN_VIEWER, SIMUTRANS_DASHBOARD_TOKEN_PLAYER,
# optional SIMUTRANS_PAK3D_DIR (a clone of the pak 3D for the 3D view of the dashboard) and
# SIMUTRANS_TIME_CONTROL=0 (the dashboard may then not pause or speed up the game).

name: simutrans

services:
  server:
    image: simutrans-horizon-server
    init: true
    restart: unless-stopped
    # the server saves the whole game when it is stopped
    stop_grace_period: 3m
    env_file: .env
    environment:
      # the bridge serves /simutrans/pak3d only when SIMUTRANS_PAK3D_DIR is set (empty: no pak 3D)
      SIMUTRANS_DASHBOARD_PAK3D: ${SIMUTRANS_PAK3D_DIR:+/simutrans/pak3d}
    ports:
      - "${SIMUTRANS_LAN_IP:?set SIMUTRANS_LAN_IP in .env}:13353:13353"
      - "${SIMUTRANS_LAN_IP}:13380:13380"
    volumes:
      # base files (config, text, script, ai, themes, font) and the pakset, byte-identical to the clients
      - ./base:/simutrans/base:ro
      # user directory: simuconf.tab, settings, save/ and the server's own saves
      - ./user:/simutrans/user
      # optional pak 3D clone (models of the 3D view), read only; without SIMUTRANS_PAK3D_DIR an unused
      # second view of base/ (an existing directory, so Docker creates nothing on the host)
      - ${SIMUTRANS_PAK3D_DIR:-./base}:/simutrans/pak3d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
